name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./data/cardroom.db
      SESSION_SECRET: ci-test-session-secret-with-32-characters-minimum
      NODE_ENV: test
      WEB_ORIGIN: "*"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run db:push
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:engine-smoke
      - run: npm run build
